  if(q){
    const ql=q.toLowerCase();
    state.assignments.filter(a=>(a.title+' '+subj(a.subjectId).name+' '+(a.description||'')+' '+(a.notes||'')).toLowerCase().includes(ql)).slice(0,7)
      .forEach(a=>out.push({icon:'checksq',title:a.title,sub:`${subj(a.subjectId).name} · ${relDue(a.dueDate)}`,go(){openAssignmentDetail(a.id);}}));
    state.subjects.filter(s=>s.name.toLowerCase().includes(ql))
      .forEach(s=>out.push({icon:'book',title:s.name,sub:'Subject',go(){AF={...AF,subject:s.id,q:'',status:'all'};navigate('assignments');}}));
    state.tests.filter(t=>(t.name+' '+(t.topics||[]).join(' ')).toLowerCase().includes(ql))
      .forEach(t=>out.push({icon:'grad',title:t.name,sub:`Test · ${relDue(t.date)}`,go(){navigate('tests');}}));
  }else{
    ['dashboard','myday','calendar','analytics','assistant'].forEach(r=>out.push({icon:PAGES[r].icon,title:PAGES[r].title,sub:'Go to page',go(){navigate(r);}}));
  }
  return out.slice(0,10);
}
function openPalette(){
  openModal(`<div class="pal">
    <div class="pal-head">${icon('search',16)}<input id="pal-q" class="pal-input" placeholder="Search assignments, subjects, tests, notes…" aria-label="Search everything" autofocus></div>
    <div id="pal-res" class="pal-res"></div>
    <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>
  </div>`,{label:'Search',onMount(m){
    const q=$('#pal-q',m),res=$('#pal-res',m);
    let idx=0,items=[];
    const paintSel=()=>{$$('.pal-item',res).forEach((el,i)=>el.classList.toggle('sel',i===idx));const s=$('.pal-item.sel',res);if(s)s.scrollIntoView({block:'nearest'});};
    const run=()=>{items=palResults(q.value);idx=0;
      res.innerHTML=items.length?items.map((r,i)=>`<button class="pal-item ${i===idx?'sel':''}" data-idx="${i}"><span class="pal-icon">${icon(r.icon,15)}</span><span class="grow"><span class="pt">${esc(r.title)}</span><br><span class="ps">${esc(r.sub)}</span></span>${icon('chevr',14)}</button>`).join(''):'<div class="pal-none">No results — press Enter to create it as an assignment.</div>';};
    q.addEventListener('input',run);
    q.addEventListener('keydown',e=>{
      if(e.key==='ArrowDown'){e.preventDefault();idx=Math.min(idx+1,items.length-1);paintSel();}
      else if(e.key==='ArrowUp'){e.preventDefault();idx=Math.max(idx-1,0);paintSel();}
      else if(e.key==='Enter'){e.preventDefault();const r=items[idx];if(r){closeModal();r.go();}}
    });
    res.addEventListener('click',e=>{const it=e.target.closest('.pal-item');if(it){const r=items[+it.dataset.idx];if(r){closeModal();r.go();}}});
    run();q.focus();
  }});
}

/* ================= shell / router ================= */
const PAGES={
  dashboard:{title:'Dashboard',icon:'grid',render:DashboardPage,mount(page){const f=$('#qa-form',page);if(f)f.addEventListener('submit',e=>{e.preventDefault();const inp=$('#qa-input',page);const v=inp.value.trim();if(!v){openAssignmentModal();return;}inp.value='';openAssignmentModal(null,parseQuickAdd(v));});}},
  myday:{title:'My Day',icon:'sunrise',render:MyDayPage},
  assignments:{title:'Assignments',icon:'checksq',render:AssignmentsPage,mount(page){
    const rerender=()=>{$('#asg-list',page).innerHTML=asgListHTML();};
    [['af-q','q'],['af-subject','subject'],['af-status','status'],['af-priority','priority'],['af-sort','sort']].forEach(([id,key])=>{
      const el=$('#'+id,page);if(el)el.addEventListener('input',()=>{AF[key]=el.value;rerender();});
    });
  }},
  calendar:{title:'Calendar',icon:'calendar',render:CalendarPage},
  subjects:{title:'Subjects',icon:'book',render:SubjectsPage},
  tests:{title:'Tests & Exams',icon:'grad',render:TestsPage},
  timer:{title:'Study Timer',icon:'timer',render:TimerPage,mount(page){
    Timer.paint();
    const cf=$('#tcustom-form',page);if(cf)cf.addEventListener('submit',e=>{e.preventDefault();const v=clamp(parseInt($('#tcustom-min',page).value,10)||25,1,180);Timer.configure(v,Timer.linkedId,'custom');renderPage();});
    const lk=$('#t-link',page);if(lk)lk.addEventListener('change',()=>{Timer.linkedId=lk.value||null;renderPage();});
  }},
  analytics:{title:'Analytics',icon:'chart',render:AnalyticsPage},
  assistant:{title:'AI Assistant',icon:'spark',render:AssistantPage,mount(page){
    const box=$('#chat-msgs',page);if(box)box.scrollTop=box.scrollHeight;
    const f=$('#chat-form',page);if(f)f.addEventListener('submit',e=>{e.preventDefault();sendChat($('#chat-input',page).value);});
  }},
  settings:{title:'Settings',icon:'gear',render:SettingsPage}
};
function currentRoute(){const h=location.hash.replace(/^#\/?/,'');return PAGES[h]?h:'dashboard';}
function navigate(r){if(!PAGES[r])r='dashboard';if(currentRoute()===r){renderPage();return;}location.hash='#/'+r;}
function applyTheme(){document.documentElement.setAttribute('data-theme',state.prefs.theme==='light'?'light':'dark');}
const initials=()=>((state.prefs.name||'Student').split(/\s+/).map(w=>w[0]).slice(0,2).join('')||'S').toUpperCase();
function paintIdentity(){const av=$('.avatar');if(av)av.textContent=initials();}
function renderShell(){
  $('#app').innerHTML=`
  <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
    <div class="brand">${icon('zap',20)}<span>Study<span class="brand-accent">Flow</span></span></div>
    <nav class="nav">${Object.entries(PAGES).filter(([k])=>k!=='settings').map(([k,p])=>`<button class="nav-item" data-action="nav" data-route="${k}" data-nav="${k}">${icon(p.icon,17)}<span>${p.title}</span></button>`).join('')}</nav>
    <div class="side-foot"><button class="nav-item" data-action="nav" data-route="settings" data-nav="settings">${icon('gear',17)}<span>Settings</span></button></div>
  </aside>
  <div class="scrim" id="scrim" data-action="close-menu"></div>
  <div class="main">
    <header class="topbar">
      <button class="tbtn menu-btn" data-action="open-menu" aria-label="Open menu">${icon('menu',18)}</button>
      <div class="tb-title" id="tb-title">Dashboard</div>
      <div class="tb-right">
        <button id="focus-pill" class="focus-pill" data-action="nav" data-route="timer" hidden>${icon('timer',14)}<span></span></button>
        <button class="tbtn" data-action="open-search" aria-label="Search (Ctrl+K)">${icon('search',17)}<span class="kbd-hint"><kbd>Ctrl K</kbd></span></button>
        <div class="bell-wrap">
          <button class="tbtn" data-action="bell" id="bell-btn" aria-label="Notifications" aria-expanded="false">${icon('bell',17)}<span class="badge" id="bell-badge"></span></button>
        </div>
        <button class="tbtn" data-action="toggle-theme" aria-label="Toggle dark or light theme"><span class="th-moon">${icon('moon',17)}</span><span class="th-sun">${icon('sun',17)}</span></button>
        <button class="avatar" data-action="nav" data-route="settings" aria-label="Open settings">${initials()}</button>
      </div>
    </header>
    <main class="page" id="page"></main>
  </div>
  <nav class="bottomnav" aria-label="Primary mobile navigation">
    ${['dashboard','assignments','calendar','timer'].map(k=>`<button class="bn-item" data-action="nav" data-route="${k}" data-nav="${k}" aria-label="${PAGES[k].title}">${icon(PAGES[k].icon,20)}<span>${PAGES[k].title.split(' ')[0]}</span></button>`).join('')}
    <button class="bn-item" data-action="open-menu" aria-label="More pages">${icon('menu',20)}<span>More</span></button>
  </nav>`;
}
function renderPage(){
  const r=currentRoute(),p=PAGES[r];
  const page=$('#page');
  if(!page)return;
  page.innerHTML=p.render();
  const tb=$('#tb-title');if(tb)tb.textContent=p.title;
  $$('[data-nav]').forEach(el=>el.classList.toggle('active',el.dataset.nav===r));
  closeMenu();
  if(p.mount)p.mount(page);
  updateBell();tickPill();
  page.setAttribute('tabindex','-1');
  page.focus({preventScroll:true});
}
function openMenu(){const s=$('#sidebar');if(s)s.classList.add('open');const sc=$('#scrim');if(sc)sc.classList.add('show');}
function closeMenu(){const s=$('#sidebar');if(s)s.classList.remove('open');const sc=$('#scrim');if(sc)sc.classList.remove('show');}
function closeBell(){const p=$('.notif-panel');if(p)p.remove();const b=$('#bell-btn');if(b)b.setAttribute('aria-expanded','false');}
function toggleBell(){
  if($('.notif-panel')){closeBell();return;}
  const wrap=$('.bell-wrap');if(!wrap)return;
  const div=document.createElement('div');
  div.className='notif-panel';div.setAttribute('role','dialog');div.setAttribute('aria-label','Notifications');
  div.innerHTML=notifPanelHTML();
  wrap.appendChild(div);
  $('#bell-btn').setAttribute('aria-expanded','true');
}
function withPlan(fn){const p=state.plans[today()];if(!p)return;fn(p);save();renderPage();}
function shiftCal(dir){
  if(CalView==='month'){CalC.setDate(1);CalC.setMonth(CalC.getMonth()+dir);CalSel=dateStr(CalC);}
  else if(CalView==='week'){CalSel=dateStr(addDays(new Date(CalSel+'T00:00:00'),7*dir));}
  else{CalSel=dateStr(addDays(new Date(CalSel+'T00:00:00'),dir));}
  renderPage();
}
function handleAction(el){
  const act=el.dataset.action,id=el.dataset.id;
  switch(act){
    case 'nav':closeBell();navigate(el.dataset.route);break;
    case 'open-menu':openMenu();break;
    case 'close-menu':closeMenu();break;
    case 'open-search':openPalette();break;
    case 'toggle-theme':state.prefs.theme=state.prefs.theme==='light'?'dark':'light';applyTheme();save();break;
    case 'bell':toggleBell();break;
    case 'notif-read-all':state.readNotifs=buildNotifs().map(n=>n.key);save();updateBell();{const p=$('.notif-panel');if(p)p.innerHTML=notifPanelHTML();}break;
    case 'modal-close':closeModal();break;
    case 'add-asg':openAssignmentModal();break;
    case 'add-asg-date':openAssignmentModal(null,{dueDate:el.dataset.date});break;
    case 'view-asg':openAssignmentDetail(id);break;
    case 'edit-asg':{const a=findA(id);if(a)openAssignmentModal(a);break;}
    case 'del-asg':{const a=findA(id);if(!a)break;
      confirmDialog({title:'Delete assignment?',message:`“${a.title}” will be permanently removed.`,confirmText:'Delete'}).then(ok=>{
        if(!ok)return;
        state.assignments=state.assignments.filter(x=>x.id!==id);
        save();closeModal();renderPage();updateBell();
        toast('Assignment deleted.',{tone:'info'});
      });break;}
    case 'toggle-complete':toggleComplete(id);break;
    case 'start-focus':startFocus(id);break;
    case 'filter-subject':AF={q:'',subject:id,status:'all',priority:'all',sort:'due'};navigate('assignments');break;
    case 'add-subject':openSubjectModal();break;
    case 'del-subject':{const s=state.subjects.find(x=>x.id===id);if(!s)break;
      confirmDialog({title:`Delete ${s.name}?`,message:'Its assignments are kept and filed under “Unfiled”.',confirmText:'Delete subject'}).then(ok=>{
        if(!ok)return;
        state.subjects=state.subjects.filter(x=>x.id!==id);
        save();renderPage();toast('Subject deleted.',{tone:'info'});
      });break;}
    case 'add-test':openTestModal();break;
    case 'edit-test':{const t=state.tests.find(x=>x.id===id);if(t)openTestModal(t);break;}
    case 'view-test':closeBell();navigate('tests');break;
    case 'del-test':{const t=state.tests.find(x=>x.id===id);if(!t)break;
      confirmDialog({title:'Delete test?',message:`“${t.name}” will be removed.`,confirmText:'Delete'}).then(ok=>{
        if(!ok)return;
        state.tests=state.tests.filter(x=>x.id!==id);
        save();renderPage();updateBell();toast('Test deleted.',{tone:'info'});
      });break;}
    case 'log-study':{const t=state.tests.find(x=>x.id===id);if(!t)break;
      const min=clamp(+el.dataset.min||0,5,480);
      t.studyMinutesDone+=min;
      state.sessions.push({id:uid(),date:today(),minutes:min,label:t.name,t:Date.now()});
      save();renderPage();
      toast(`Logged ${min}m of study for “${t.name}”.`,{tone:'success'});break;}
    case 'test-study':{const t=state.tests.find(x=>x.id===id);if(!t)break;
      Timer.configure(25,null,'25');Timer.label=t.name;
      closeBell();navigate('timer');setTimeout(()=>Timer.start(),350);break;}
    case 'plan-gen':state.plans[today()]=generatePlan();save();renderPage();
      toast('Schedule rebuilt from your current priorities.',{tone:'success'});break;
    case 'plan-add':openPlanAddModal();break;
    case 'plan-del':withPlan(p=>{p.blocks=p.blocks.filter(x=>x.id!==id);});break;
    case 'plan-done':withPlan(p=>{const b=p.blocks.find(x=>x.id===id);if(b)b.done=!b.done;});break;
    case 'plan-up':withPlan(p=>{const i=p.blocks.findIndex(x=>x.id===id);if(i>0){const[b]=p.blocks.splice(i,1);p.blocks.splice(i-1,0,b);}});break;
    case 'plan-down':withPlan(p=>{const i=p.blocks.findIndex(x=>x.id===id);if(i>=0&&i<p.blocks.length-1){const[b]=p.blocks.splice(i,1);p.blocks.splice(i+1,0,b);}});break;
    case 'plan-clear':
      confirmDialog({title:'Clear today\u2019s schedule?',message:'All blocks for today will be removed. You can regenerate anytime.',confirmText:'Clear'}).then(ok=>{
        if(ok)withPlan(p=>{p.blocks=[];});
      });break;
    case 'cal-mode':CalView=el.dataset.mode;renderPage();break;
    case 'cal-prev':shiftCal(-1);break;
    case 'cal-next':shiftCal(1);break;
    case 'cal-today':CalC=new Date();CalSel=today();renderPage();break;
    case 'cal-pick':CalSel=el.dataset.date;CalC=new Date(el.dataset.date+'T00:00:00');renderPage();break;
    case 'timer-mode':{const m=+el.dataset.mode;Timer.configure(m,Timer.linkedId,el.dataset.mode);renderPage();break;}
    case 'timer-custom-open':{Timer.configure(Math.max(1,Math.round(Timer.total/60)),Timer.linkedId,'custom');renderPage();const inp=$('#tcustom-min');if(inp)inp.focus();break;}
    case 'timer-toggle':Timer.running?Timer.pause():Timer.start();tickPill();break;
    case 'timer-reset':Timer.reset();renderPage();break;
    case 'ai-suggest':sendChat(el.dataset.q);break;
    case 'export-data':{
      try{
        const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);a.download='studyflow-backup-'+today()+'.json';
        a.click();URL.revokeObjectURL(a.href);
        toast('Backup downloaded.',{tone:'success'});
      }catch(e){toast('Export failed: '+e.message,{tone:'danger'});}
      break;}
    case 'reset-demo':
      confirmDialog({title:'Reset demo data?',message:'Your current assignments, subjects, tests and sessions will be replaced with the sample dataset.',confirmText:'Reset demo'}).then(ok=>{
        if(!ok)return;
        seedAll();save();renderShell();renderPage();updateBell();
        toast('Demo data restored.',{tone:'success'});
      });break;
    case 'wipe-data':
      confirmDialog({title:'Delete all data?',message:'Every assignment, subject, test, session and chat message will be permanently deleted from this browser. This cannot be undone.',confirmText:'Delete everything'}).then(ok=>{
        if(!ok)return;
        state.assignments=[];state.subjects=[];state.tests=[];state.sessions=[];state.plans={};state.chat=[];state.readNotifs=[];
        state.prefs={...DEFAULT_PREFS,name:state.prefs.name||'',theme:state.prefs.theme};
        save();Timer.reset();renderShell();renderPage();updateBell();
        toast('All data deleted. Fresh start.',{tone:'info'});
      });break;
  }
}

/* ---- global listeners ---- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(!el){if(!e.target.closest('.bell-wrap'))closeBell();return;}
  if(el.tagName==='FORM')return;
  handleAction(el);
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();if($('.pal'))return;openPalette();return;}
  if(e.key==='Escape'&&!$('#modal-root').children.length)closeBell();
});
function onField(e){
  const f=e.target.closest('[data-field]');if(!f)return;
  const key=f.dataset.field;let v=f.value;
  if(key==='sessionLength')v=parseInt(v,10)||25;
  if(key==='name')v=v.slice(0,40);
  state.prefs[key]=v;save();
  if(key==='theme')applyTheme();
  if(key==='name')paintIdentity();
}
document.addEventListener('input',onField);
document.addEventListener('change',e=>{
  onField(e);
  const f=e.target.closest('[data-field]');
  if(f&&f.dataset.field==='name')renderPage();
  const pt=e.target.closest('[data-plan-time]');
  if(pt){
    const plan=state.plans[today()];
    const b=plan&&plan.blocks.find(x=>x.id===pt.dataset.planTime);
    if(b&&pt.value){b.start=pt.value;plan.blocks.sort((x,y)=>x.start.localeCompare(y.start));save();renderPage();}
  }
});
window.addEventListener('hashchange',renderPage);
window.addEventListener('resize',()=>{if(window.innerWidth>920)closeMenu();});

/* ---- boot ---- */
load();
applyTheme();
renderShell();
{const m=clamp(+state.prefs.sessionLength||25,5,180);Timer.configure(m,null,(m===25||m===50)?String(m):'custom');}
renderPage();
updateBell();

})();
</script>
