<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="description" content="StudyFlow — Smart Homework Dashboard for students.">
<title>StudyFlow — Smart Homework Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%236d7cff'/%3E%3Cpath d='M13 4 5 14h6l-1 6 8-10h-6l1-6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ design tokens ============ */
*{box-sizing:border-box;margin:0;padding:0}
[data-theme="dark"]{
  --bg:#0a0d16;--surface:#10141f;--surface2:#161b29;--surface3:#1d2334;
  --border:#232a3c;--border2:#323c58;
  --text:#edf0f7;--muted:#8c95ab;--faint:#5c6579;
  --accent:#6d7cff;--accent2:#9b6dff;--accent-soft:rgba(109,124,255,.14);--accent-t:#aab3ff;
  --green:#3ddc97;--green-bg:rgba(61,220,151,.13);--green-t:#7ce9bd;
  --yellow:#fbbf24;--yellow-bg:rgba(251,191,36,.12);--yellow-t:#fcd34d;
  --orange:#fb923c;--orange-bg:rgba(251,146,60,.13);--orange-t:#fdba74;
  --red:#f8717a;--red-bg:rgba(248,113,122,.13);--red-t:#ffa1a8;
  --hover:rgba(255,255,255,.05);--shadow:0 12px 34px rgba(0,0,0,.38);color-scheme:dark;
}
[data-theme="light"]{
  --bg:#f3f4f9;--surface:#ffffff;--surface2:#f7f8fc;--surface3:#eef0f7;
  --border:#e4e7f0;--border2:#d2d7e5;
  --text:#171b26;--muted:#5f6779;--faint:#9aa1b3;
  --accent:#5a67f2;--accent2:#8b5cf6;--accent-soft:rgba(90,103,242,.10);--accent-t:#4650d9;
  --green:#0fa968;--green-bg:rgba(15,169,104,.10);--green-t:#0b7a4d;
  --yellow:#d99406;--yellow-bg:rgba(217,148,6,.10);--yellow-t:#a87305;
  --orange:#e2761b;--orange-bg:rgba(226,118,27,.10);--orange-t:#b45a0e;
  --red:#e14b55;--red-bg:rgba(225,75,85,.09);--red-t:#b93040;
  --hover:rgba(20,26,45,.05);--shadow:0 10px 30px rgba(23,27,38,.09);color-scheme:light;
}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(1100px 520px at 18% -12%,var(--accent-soft),transparent 65%);pointer-events:none;z-index:0}
body.modal-open{overflow:hidden}
[hidden]{display:none!important}
button{font-family:inherit}
a{color:var(--accent-t)}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ============ layout ============ */
.shell{display:flex;min-height:100vh;position:relative;z-index:1}
.sidebar{position:fixed;inset:0 auto 0 0;width:252px;padding:20px 14px 16px;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);z-index:50}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:800;font-size:17px;letter-spacing:-.02em}
.brand .ic{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;padding:5px;width:26px;height:26px}
.brand-accent{background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:500;font-size:13.5px;border:0;background:none;cursor:pointer;width:100%;text-align:left;transition:.15s}
.nav-item:hover{color:var(--text);background:var(--hover)}
.nav-item.active{color:var(--accent-t);background:var(--accent-soft)}
.main{flex:1;margin-left:252px;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:12px 26px;background:rgba(10,13,22,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
[data-theme="light"] .topbar{background:rgba(243,244,249,.85)}
.tb-title{font-weight:700;font-size:14.5px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:4px}
.tbtn{position:relative;display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);cursor:pointer;padding:8px;border-radius:10px}
.tbtn:hover{background:var(--hover);color:var(--text)}
[data-theme="dark"] .th-sun{display:none}
[data-theme="light"] .th-moon{display:none}
.kbd-hint kbd{margin-left:2px}
.badge{position:absolute;top:2px;right:2px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:99px;display:none;place-items:center;padding:0 4px}
.badge.show{display:grid}
.bell-wrap{position:relative}
.focus-pill{display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);color:var(--accent-t);border:1px solid transparent;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;margin-right:4px}
.focus-pill:hover{background:var(--accent);color:#fff}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:12px;font-weight:700;border:0;cursor:pointer;display:grid;place-items:center;margin-left:4px}
.page{padding:28px;max-width:1180px;width:100%;margin:0 auto;flex:1;animation:fadeUp .3s ease both}
.scrim{position:fixed;inset:0;background:rgba(3,5,10,.6);z-index:45;opacity:0;pointer-events:none;transition:.25s}
.scrim.show{opacity:1;pointer-events:auto}
.bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:48;background:var(--surface);border-top:1px solid var(--border);padding:6px 8px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--faint);font-size:10px;font-weight:600;cursor:pointer;padding:5px 10px;border-radius:10px}
.bn-item.active{color:var(--accent-t)}

/* ============ primitives ============ */
h1,h2,h3{letter-spacing:-.02em;line-height:1.25}
.sub{color:var(--muted);font-size:14px}
.faint{color:var(--faint)}
.muted{color:var(--muted)}
.sm{font-size:13px}.xs{font-size:11.5px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt14{margin-top:14px}.mt16{margin-top:16px}
.flex{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grad{background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px}
.card-t{font-size:14px;font-weight:700;margin-bottom:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-weight:600;font-size:13.5px;border:1px solid transparent;cursor:pointer;transition:.15s;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 14px var(--accent-soft)}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-ghost{background:var(--surface2);border-color:var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--border2)}
.btn-danger{background:var(--red-bg);color:var(--red-t);border-color:transparent}
.btn-danger:hover{filter:brightness(1.05)}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.big{padding:12px 26px;font-size:15px;border-radius:13px}
.btn.full{width:100%;justify-content:center}
.ibtn{width:30px;height:30px;display:inline-grid;place-items:center;background:none;border:0;color:var(--muted);cursor:pointer;border-radius:8px;flex:none}
.ibtn:hover{background:var(--hover);color:var(--text)}
.ibtn.danger:hover{color:var(--red-t);background:var(--red-bg)}
.link-btn{background:none;border:0;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 6px;border-radius:6px}
.link-btn:hover{color:var(--accent-t)}
.input,select.input,textarea.input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px 12px;font:inherit;font-size:13.5px;transition:border .15s}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input.invalid{border-color:var(--red)}
.input.mini{width:auto;padding:5px 8px;font-size:12.5px}
.range{accent-color:var(--accent);width:100%}
kbd{background:var(--surface3);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:10.5px;font-family:inherit;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.chip .ic{opacity:.8}
.chip-urgent{background:var(--red-bg);color:var(--red-t)}
.chip-high{background:var(--orange-bg);color:var(--orange-t)}
.chip-medium{background:var(--yellow-bg);color:var(--yellow-t)}
.chip-low{background:var(--accent-soft);color:var(--accent-t)}
.chip-done{background:var(--hover);color:var(--faint)}
.due-overdue{background:var(--red-bg);color:var(--red-t)}
.due-today{background:var(--orange-bg);color:var(--orange-t)}
.due-soon{background:var(--yellow-bg);color:var(--yellow-t)}
.due-later{background:var(--hover);color:var(--muted)}
.due-done{background:var(--green-bg);color:var(--green-t)}
.st-todo{background:var(--hover);color:var(--muted)}
.st-progress{background:var(--accent-soft);color:var(--accent-t)}
.st-completed{background:var(--green-bg);color:var(--green-t)}
.st-overdue{background:var(--red-bg);color:var(--red-t)}
.tbadge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);letter-spacing:.03em}
@supports not (background:color-mix(in srgb,red 10%,transparent)){.tbadge{background:var(--surface3);color:var(--muted)}}
.dtag{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.diffbars{display:inline-flex;gap:2px;align-items:flex-end}
.diffbars i{width:3px;border-radius:2px;background:var(--border2)}
.diffbars i:nth-child(1){height:4px}.diffbars i:nth-child(2){height:6px}.diffbars i:nth-child(3){height:8px}
.d-easy i:nth-child(1){background:var(--green)}
.d-medium i:nth-child(-n+2){background:var(--yellow)}
.d-hard i{background:var(--red)}
.pbar{height:5px;border-radius:99px;background:var(--surface3);overflow:hidden;flex:1;min-width:60px}
.pfill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s cubic-bezier(.22,1,.36,1)}
.pfill.done{background:var(--green)}
.empty{border:1.5px dashed var(--border2);border-radius:16px;padding:44px 22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ic{opacity:.5;margin-bottom:4px}
.empty h3{color:var(--text);font-size:16px}
.empty p{font-size:13.5px;max-width:400px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:750}
.ph-actions{display:flex;gap:10px;flex-wrap:wrap}
.sec-head{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sec-head h2,.sec-head h3{font-size:16px}
.sec-sub{color:var(--muted);font-size:12.5px;font-weight:500}
.sec-count{background:var(--surface3);color:var(--muted);font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px}
.sec-t.ot{color:var(--red-t)}
.link-btn.ml{margin-left:auto}
.srow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.srow:last-of-type{border-bottom:0}
.srow .muted{font-size:12.5px}
.link-btn.ml{margin-left:auto}
.fatal{margin:48px auto;max-width:520px;text-align:center;padding:32px}
.pad{padding:16px}

/* ============ dashboard ============ */
.dash-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.dash-h{font-size:29px;font-weight:760}
.qa{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px 6px 6px 13px;min-width:min(420px,100%);transition:border .15s}
.qa:focus-within{border-color:var(--accent)}
.qa-ic{color:var(--accent-t);display:inline-flex}
.qa-input{flex:1;background:none;border:0;outline:none;color:var(--text);font:inherit;font-size:13.5px;min-width:0}
.qa-input::placeholder{color:var(--faint)}
.stat{display:flex;flex-direction:column;gap:4px}
.stat-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;margin-bottom:6px}
.stat-num{font-size:25px;font-weight:750;font-variant-numeric:tabular-nums}
.stat-lab{font-size:13px;font-weight:600}
.stat-sub{font-size:11.5px;color:var(--muted)}
.hero{border-radius:20px;padding:1px;background:linear-gradient(135deg,rgba(109,124,255,.55),rgba(155,109,255,.22) 45%,rgba(109,124,255,.06));margin-top:14px}
.hero-inner{background:var(--surface);border-radius:19px;padding:22px 24px;position:relative;overflow:hidden}
.hero-inner::before{content:'';position:absolute;inset:0;background:radial-gradient(600px 200px at 88% -40%,var(--accent-soft),transparent);pointer-events:none}
.hero-eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--accent-t);display:flex;gap:7px;align-items:center;text-transform:uppercase;margin-bottom:12px}
.hero-body{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;position:relative}
.hero-title{font-size:25px;font-weight:750;margin:4px 0 2px}
.hero-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:12.5px;font-weight:600;align-items:center}
.hmeta{display:inline-flex;gap:5px;align-items:center}
.hmeta.imp{color:var(--orange-t)}
.hero-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hero-why{margin-top:16px;background:var(--accent-soft);border-radius:12px;padding:12px 14px;position:relative}
.hero-why-l{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-t);display:flex;gap:6px;align-items:center;margin-bottom:3px}
.hero-why p{font-size:13.5px;color:var(--text)}

/* ============ assignment cards ============ */
.acard{display:flex;gap:14px;padding:15px 16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;transition:.18s;align-items:flex-start}
.acard:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.acard.is-done{opacity:.65}
.acheck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border2);background:transparent;cursor:pointer;display:grid;place-items:center;color:transparent;flex:none;margin-top:2px;transition:.15s}
.acheck:hover{border-color:var(--accent)}
.acheck[aria-checked="true"]{background:var(--green);border-color:var(--green);color:#06281c}
.acard-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.acard-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.asubj{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.atitle{background:none;border:0;padding:0;text-align:left;color:var(--text);font:inherit;font-size:15px;font-weight:650;cursor:pointer;overflow-wrap:anywhere}
.atitle:hover{color:var(--accent-t)}
.is-done .atitle{text-decoration:line-through;color:var(--muted)}
.ameta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;font-weight:500;align-items:center}
.mitem{display:inline-flex;gap:4px;align-items:center}
.mitem.pg{color:var(--accent-t);font-weight:700}
.acard-side{display:flex;flex-direction:column;gap:2px}
.alist{display:grid;gap:10px}

/* ============ filters ============ */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.fsearch{flex:1;min-width:210px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0 12px;color:var(--muted)}
.fsearch:focus-within{border-color:var(--accent)}
.qinput{flex:1;background:none;border:0;outline:none;color:var(--text);font:inherit;font-size:13.5px;padding:9px 0;min-width:0}
.sel{width:auto;min-width:140px}

/* ============ calendar ============ */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cal-title{font-size:19px;font-weight:750}
.seg.tabs{display:inline-flex;background:var(--surface3);border-radius:10px;padding:3px;gap:2px}
.segbtn{padding:6px 14px;border:0;background:none;color:var(--muted);font-weight:600;font-size:12.5px;border-radius:8px;cursor:pointer}
.segbtn.on{background:var(--surface);color:var(--text);box-shadow:0 1px 5px rgba(0,0,0,.22)}
[data-theme="light"] .segbtn.on{background:#fff}
.cal-layout{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-dow span{text-align:center;font-size:10.5px;font-weight:800;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{min-height:100px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:7px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;color:var(--text);transition:.15s;overflow:hidden}
.cal-cell:hover{border-color:var(--border2);background:var(--surface2)}
.cal-cell.dim{opacity:.35}
.cal-cell.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cal-num{width:23px;height:23px;border-radius:8px;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--muted);align-self:flex-end}
.cal-cell.today .cal-num{background:var(--accent);color:#fff}
.cal-evs{display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-ev{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--muted);background:var(--surface3);border-radius:6px;padding:2.5px 6px;min-width:0}
.cal-ev i{width:6px;height:6px;border-radius:2px;background:var(--c);flex:none}
.cal-ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-more{font-size:10px;color:var(--faint);font-weight:700;padding-left:4px}
.cal-side{position:sticky;top:76px}
.cal-day-t{font-size:15px;margin-bottom:10px}
.ev-list{display:grid;gap:8px;margin-bottom:12px}
.ev{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);cursor:pointer;width:100%;text-align:left;color:var(--text)}
.ev:hover{border-color:var(--border2)}
.evdot{width:9px;height:9px;border-radius:3px;flex:none}
.ev-t{font-weight:650;font-size:13.5px;display:block}
.ev-s{font-size:11.5px;color:var(--muted);display:block}
.ev-time{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.cal-wscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:8px;min-width:860px}
.cal-wcol{border:1px solid var(--border);border-radius:12px;padding:8px;background:var(--surface);display:flex;flex-direction:column;gap:7px;min-height:150px}
.cal-wcol.today{border-color:var(--accent)}
.cal-whead{background:none;border:0;color:var(--faint);font-size:10.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;padding:2px;letter-spacing:.05em;text-transform:uppercase}
.cal-whead b{color:var(--text);font-size:15px}
.cal-whead.on b{color:var(--accent-t)}
.cal-wev{display:flex;gap:6px;align-items:center;width:100%;background:var(--surface3);border:0;border-left:3px solid var(--c);border-radius:8px;padding:5px 7px;font-size:11px;font-weight:600;color:var(--text);cursor:pointer;text-align:left}
.cal-wev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayrow{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.daytime{font-weight:700;font-size:13px;color:var(--accent-t);min-width:74px;font-variant-numeric:tabular-nums}

/* ============ subjects / tests ============ */
.scard-btn{display:flex;align-items:center;gap:9px;background:none;border:0;cursor:pointer;padding:2px;color:var(--text);text-align:left;font-family:inherit;min-width:0}
.scard-btn h3{font-size:15.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar-l{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;min-width:0}
.sbar-l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar-row{display:grid;grid-template-columns:minmax(90px,140px) 1fr 52px;gap:10px;align-items:center;padding:7px 0}
.sbar{height:8px;border-radius:99px;background:var(--surface3);overflow:hidden}
.sbar>div{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.tcard.past{opacity:.55}
.tcard-t{font-size:17px;font-weight:720;margin:10px 0 12px}
.tcard-grid{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.cd{display:flex;flex-direction:column;gap:0}
.cd b{font-size:34px;font-weight:780;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.tcard-info{flex:1;min-width:180px}
.topics{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.topic{font-size:11px;background:var(--surface3);border-radius:99px;padding:3px 9px;color:var(--muted);font-weight:600}
.rec{margin-top:14px;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text);display:flex;gap:8px;align-items:flex-start}
.rec .ic{color:var(--accent-t);flex:none;margin-top:2px}

/* ============ my day ============ */
.timeline{display:flex;flex-direction:column;gap:10px}
.block{display:flex;gap:12px;align-items:center;padding:11px 13px;border:1px solid var(--border);border-radius:13px;background:var(--surface)}
.block.task{border-left:3px solid var(--accent)}
.block.school{border-left:3px solid var(--faint)}
.block.break{border-style:dashed;opacity:.85}
.block.custom{border-left:3px solid var(--yellow)}
.block.done{opacity:.55}
.block.done .block-label{text-decoration:line-through}
.block-time{font-weight:700;font-size:13px;color:var(--accent-t);min-width:66px;font-variant-numeric:tabular-nums}
.block-ic{color:var(--faint);display:inline-flex}
.block-label{font-weight:650;font-size:14px}
.dayside{align-self:start}

/* ============ timer ============ */
.timer-grid{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.tcenter{text-align:center}
.tmodes{display:inline-flex;background:var(--surface3);border-radius:11px;padding:3px;gap:2px;margin-bottom:20px;max-width:100%;flex-wrap:wrap;justify-content:center}
.ring-wrap{position:relative;width:min(272px,74vw);margin:0 auto}
.ring-wrap svg{width:100%;height:auto;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--surface3);stroke-width:11}
.ring-fg{fill:none;stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.t-center{position:absolute;inset:0;display:grid;place-content:center;gap:2px}
.t-time{font-size:52px;font-weight:760;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.t-state{font-size:12.5px;color:var(--muted);font-weight:600}
.tcontrols{display:flex;justify-content:center;gap:12px;margin-top:20px}
.tcustom{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:14px}
.flabel{display:flex;gap:6px;align-items:center;font-weight:650;font-size:14px}
.flame{display:inline-flex;gap:5px;align-items:center;color:var(--orange-t)}

/* ============ analytics ============ */
.bars{display:flex;gap:10px;align-items:stretch;height:185px;padding-top:14px}
.bar-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;min-width:0}
.bar-v{font-size:11px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;min-height:14px}
.bar{width:100%;max-width:34px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:8px 8px 3px 3px;min-height:4px;transition:height .5s}
.bar-l{font-size:10.5px;color:var(--faint);font-weight:700}
.area{width:100%;height:auto}
.sloads{margin-top:4px}
.big-line{font-size:15.5px;font-weight:700;margin-bottom:12px}
.insights{list-style:none;display:flex;flex-direction:column;gap:9px}
.insights li{font-size:13.5px;color:var(--muted);padding-left:16px;position:relative}
.insights li::before{content:'';position:absolute;left:2px;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* ============ assistant ============ */
.chat{display:flex;flex-direction:column;height:min(620px,calc(100dvh - 250px));min-height:420px;padding:0;overflow:hidden}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:18px}
.msg{max-width:80%;font-size:14px;animation:fadeUp .25s both}
.msg.user{align-self:flex-end}
.msg.user .msg-body{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:16px 16px 4px 16px;padding:10px 14px}
.msg.ai{align-self:flex-start}
.msg.ai .msg-body{background:var(--surface2);border:1px solid var(--border);border-radius:16px 16px 16px 4px;padding:10px 14px}
.msg .li{padding-left:14px;position:relative}
.msg .li::before{content:'';position:absolute;left:2px;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.msg .sp{height:6px}
.msg strong{font-weight:700}
.typing{display:flex;gap:5px;padding:14px}
.typing span{width:7px;height:7px;background:var(--muted);border-radius:50%;animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.18s}
.typing span:nth-child(3){animation-delay:.36s}
.suggest{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 12px}
.suggest button{font-size:12.5px;padding:7px 12px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);cursor:pointer}
.suggest button:hover{color:var(--text);border-color:var(--border2)}
.chat-form{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--border)}

/* ============ forms & modals ============ */
.modal-scrim{position:fixed;inset:0;z-index:100;background:rgba(4,6,12,.62);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:22px;overflow-y:auto;animation:fade .2s}
.modal{background:var(--surface2);border:1px solid var(--border2);border-radius:20px;padding:22px;width:100%;max-width:580px;margin:auto;animation:pop .28s cubic-bezier(.22,1,.36,1);box-shadow:0 24px 80px rgba(0,0,0,.5)}
.modal.wide{max-width:680px}
.m-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.m-head h3{font-size:17px;font-weight:720}
.f-group{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.f-label{font-size:12px;font-weight:700;color:var(--muted)}
.f-row2{display:flex;gap:12px}
.f-row2>*{flex:1;min-width:0}
.f-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.f-err{background:var(--red-bg);color:var(--red-t);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
.seg{display:flex;background:var(--surface3);border-radius:10px;padding:3px;gap:2px}
.seg-opt{flex:1;position:relative;cursor:pointer}
.seg-opt input{position:absolute;opacity:0;inset:0;pointer-events:none}
.seg-opt span{display:flex;justify-content:center;padding:6px 4px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);transition:.15s}
.seg-opt input:checked+span{background:var(--surface);color:var(--text);box-shadow:0 1px 6px rgba(0,0,0,.25)}
[data-theme="light"] .seg-opt input:checked+span{background:#fff}
.seg-opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch input{position:absolute;opacity:0;pointer-events:none}
.swatch span{width:30px;height:30px;border-radius:50%;background:var(--c);display:block;cursor:pointer;border:2px solid transparent;transition:.15s}
.swatch input:checked+span{border-color:var(--text);transform:scale(1.15)}
.swatch input:focus-visible+span{outline:2px solid var(--accent)}
.d-head{display:flex;justify-content:space-between;align-items:center}
.d-title{font-size:21px;font-weight:750;margin:6px 0 4px}
.d-desc{color:var(--muted);font-size:13.5px;margin-bottom:12px}
.d-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.d-grid>div{display:flex;flex-direction:column;gap:2px}
.d-grid b{font-size:13.5px}
.notes{background:var(--surface3);border-radius:10px;padding:10px 12px;margin-top:12px}
.notes p{font-size:13px;margin-top:2px}
.confirm p{font-size:14px}

/* ============ palette / notifications / toasts ============ */
.pal-head{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--border);padding:2px 2px 14px}
.pal-input{flex:1;background:none;border:0;color:var(--text);font:inherit;font-size:15px;outline:none;min-width:0}
.pal-res{max-height:340px;overflow-y:auto;padding:8px 0}
.pal-item{display:flex;gap:12px;align-items:center;width:100%;padding:9px 12px;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--text);text-align:left}
.pal-item.sel{background:var(--hover)}
.pal-icon{width:34px;height:34px;border-radius:10px;background:var(--surface3);display:grid;place-items:center;color:var(--muted);flex:none}
.pt{font-size:13.5px;font-weight:650}
.ps{font-size:11.5px;color:var(--muted)}
.pal-none{padding:20px;text-align:center;color:var(--muted);font-size:13.5px}
.pal-foot{display:flex;gap:14px;border-top:1px solid var(--border);padding-top:10px;font-size:11.5px;color:var(--faint)}
.notif-panel{position:absolute;right:0;top:calc(100% + 10px);width:340px;max-width:calc(100vw - 32px);background:var(--surface2);border:1px solid var(--border2);border-radius:14px;box-shadow:var(--shadow);z-index:60;overflow:hidden;animation:pop .18s}
.notif-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)}
.notif-list{max-height:320px;overflow-y:auto}
.n-item{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;font-size:13px;border-bottom:1px solid var(--border);color:var(--text)}
.n-item:last-child{border-bottom:0}
.n-item.read{opacity:.5}
.n-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.n-ic.tone-danger{background:var(--red-bg);color:var(--red-t)}
.n-ic.tone-warn{background:var(--orange-bg);color:var(--orange-t)}
.n-ic.tone-info{background:var(--accent-soft);color:var(--accent-t)}
.n-ic.tone-success{background:var(--green-bg);color:var(--green-t)}
.notif-empty{padding:22px;text-align:center;color:var(--muted);font-size:13.5px}
#toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:min(92vw,380px)}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border:1px solid var(--border2);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);animation:slideIn .3s cubic-bezier(.22,1,.36,1);font-size:13.5px}
.toast.out{opacity:0;transform:translateX(14px);transition:.25s}
.toast .ti{flex:none;margin-top:1px;display:inline-flex}
.toast.t-success .ti{color:var(--green)}
.toast.t-warn .ti{color:var(--orange)}
.toast.t-danger .ti{color:var(--red)}
.toast.t-info .ti{color:var(--accent-t)}
.toast-t{font-weight:700;font-size:12px;margin-bottom:1px}
.toast-x{background:none;border:0;color:var(--faint);cursor:pointer;padding:2px;margin-left:2px}

/* ============ animations ============ */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}}
@keyframes slideIn{from{opacity:0;transform:translateX(18px)}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ============ responsive ============ */
@media(max-width:1020px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.cal-layout{grid-template-columns:1fr}.cal-side{position:static}}
@media(max-width:920px){
  .sidebar{transform:translateX(-103%);transition:transform .28s cubic-bezier(.22,1,.36,1);box-shadow:0 0 60px rgba(0,0,0,.4);width:264px}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .bottomnav{display:flex}
  .menu-btn{display:inline-flex}
  .page{padding:18px 14px 96px}
  .topbar{padding:10px 14px}
  .timer-grid{grid-template-columns:1fr}
  .d-grid{grid-template-columns:repeat(2,1fr)}
  .tb-title{font-size:13px}
}
@media(min-width:921px){.menu-btn{display:none}.scrim{display:none}}
@media(max-width:640px){
  .g2,.g3{grid-template-columns:1fr}
  .dash-h{font-size:24px}
  .qa{min-width:100%}
  .cal-cell{min-height:60px;padding:5px}
  .cal-ev{padding:0;width:9px;height:9px;border-radius:3px;background:var(--c);border:0}
  .cal-ev i,.cal-ev span{display:none}
  .cal-more{display:none}
  .cal-dow{gap:3px}.cal-grid{gap:3px}
  #toasts{right:12px;left:12px;bottom:calc(74px + env(safe-area-inset-bottom));max-width:none}
  .block .mv{display:none}
  .hero-actions{width:100%}
}

/* ================= constants & store ================= */
const LS_KEY='studyflow-v1';
const TYPES=['homework','project','test','quiz','essay','other'];
const DIFFS=['easy','medium','hard'];
const IMPS=['low','normal','high'];
const PALETTE=['#818cf8','#38bdf8','#34d399','#fbbf24','#fb923c','#f8717a','#f472b6','#a78bfa','#22d3ee','#a3e635'];
const TYPE_COLORS={homework:'#818cf8',project:'#22d3ee',test:'#f8717a',quiz:'#fbbf24',essay:'#f472b6',other:'#94a3b8'};
const DEFAULT_PREFS={name:'Alex',theme:'dark',sessionLength:25,weekStart:'monday',schoolStart:'08:00',schoolEnd:'15:15',dayStart:'16:00',aiKey:'',aiUrl:'',aiModel:'gpt-4o-mini'};
const state={assignments:[],subjects:[],tests:[],sessions:[],plans:{},prefs:{...DEFAULT_PREFS},readNotifs:[],chat:[]};
let saveWarned=false;

function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}
  catch(e){console.warn('save failed',e);if(!saveWarned){saveWarned=true;toast('Heads up: changes cannot be saved (browser storage blocked).',{tone:'warn'});}}}

function normAsg(a){
  a.estimatedMinutes=clamp(+a.estimatedMinutes||30,5,600);
  a.progress=clamp(Math.round(+a.progress||0),0,100);
  a.completed=!!a.completed;a.workedMinutes=+a.workedMinutes||0;
  if(a.completed&&a.progress<100)a.progress=100;
  a.difficulty=DIFFS.includes(a.difficulty)?a.difficulty:'medium';
  a.importance=IMPS.includes(a.importance)?a.importance:'normal';
  a.type=TYPES.includes(a.type)?a.type:'homework';
}
function load(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw){seedAll();save();return;}
    const d=JSON.parse(raw);
    state.subjects=(Array.isArray(d.subjects)?d.subjects:[]).filter(s=>s&&s.id&&typeof s.name==='string');
    state.subjects.forEach(s=>{if(!/^#[0-9a-f]{6}$/i.test(s.color||''))s.color='#818cf8';});
    state.assignments=(Array.isArray(d.assignments)?d.assignments:[]).filter(a=>a&&a.id&&typeof a.title==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(a.dueDate||''));
    state.assignments.forEach(normAsg);
    state.tests=(Array.isArray(d.tests)?d.tests:[]).filter(t=>t&&t.id&&t.name&&/^\d{4}-\d{2}-\d{2}$/.test(t.date||''));
    state.tests.forEach(t=>{t.studyMinutesNeeded=+t.studyMinutesNeeded||60;t.studyMinutesDone=+t.studyMinutesDone||0;t.topics=Array.isArray(t.topics)?t.topics:[];t.difficulty=DIFFS.includes(t.difficulty)?t.difficulty:'medium';});
    state.sessions=(Array.isArray(d.sessions)?d.sessions:[]).filter(s=>s&&/^\d{4}-\d{2}-\d{2}$/.test(s.date)&&+s.minutes>0);
    state.plans=(d.plans&&typeof d.plans==='object')?d.plans:{};
    state.readNotifs=Array.isArray(d.readNotifs)?d.readNotifs:[];
    state.chat=Array.isArray(d.chat)?d.chat.slice(-60):[];
    state.prefs={...DEFAULT_PREFS,...(d.prefs||{})};
    const cut=dateStr(addDays(new Date(),-21));
    for(const k in state.plans)if(k<cut)delete state.plans[k];
  }catch(e){console.warn('load failed, reseeding',e);seedAll();save();}
}

/* ================= domain logic ================= */
const findA=id=>state.assignments.find(a=>a.id===id);
const subj=id=>state.subjects.find(s=>s.id===id)||{id:'',name:'Unfiled',color:'#8b95ab'};
const sumSessions=ds=>state.sessions.filter(s=>s.date===ds).reduce((n,s)=>n+s.minutes,0);
const totalStudy=()=>state.sessions.reduce((n,s)=>n+s.minutes,0);
function statusOf(a){return a.completed?'completed':daysUntil(a.dueDate)<0?'overdue':a.progress>0?'progress':'todo';}
function stats(){
  const total=state.assignments.length,done=state.assignments.filter(a=>a.completed).length;
  const inc=state.assignments.filter(a=>!a.completed);
  const overdue=inc.filter(a=>daysUntil(a.dueDate)<0).length;
  return{total,done,inc,overdue,rate:total?Math.round(done/total*100):0};
}
function nextTestFor(sid){
  return state.tests.filter(t=>t.subjectId===sid&&daysUntil(t.date)>=0&&daysUntil(t.date)<=10)
    .sort((a,b)=>a.date.localeCompare(b.date))[0];
}
function priorityOf(a){
  if(a.completed)return{score:0,tier:'done',reasons:['Completed']};
  const d=daysUntil(a.dueDate);let score=0;const reasons=[];
  if(d<0){score=100+Math.min(-d,14)*4;reasons.push(d===-1?'1 day overdue':`${-d} days overdue`);}
  else if(d===0){score=90;reasons.push('due today');}
  else if(d===1){score=70;reasons.push('due tomorrow');}
  else if(d<=3){score=50;reasons.push(`due in ${d} days`);}
  else if(d<=6){score=30;reasons.push(`due in ${d} days`);}
  else{score=15;reasons.push(d===7?'due in a week':`due in ${d} days`);}
  score+={easy:-3,medium:3,hard:8}[a.difficulty];
  if(a.difficulty!=='easy')reasons.push(a.difficulty);
  const remain=Math.max(5,Math.round(a.estimatedMinutes*(1-a.progress/100)));
  score+=Math.min(Math.round(remain/20),8);
  if(remain>=60)reasons.push(`about ${minutesLabel(remain)} of work left`);
  score+={low:-5,normal:2,high:12}[a.importance];
  if(a.importance==='high')reasons.push('high importance');
  if(a.progress>0)score-=Math.round(a.progress/12);
  const t=nextTestFor(a.subjectId);
  if(t){const td=daysUntil(t.date);if(td<=10){score+=10;reasons.push(`${t.name} in ${td===0?'today':td+' days'}`);}}
  if(d>=0&&remain>(d+1)*90){score+=6;reasons.push('tight deadline');}
  score=clamp(Math.round(score),0,150);
  const tier=score>=85?'urgent':score>=60?'high':score>=35?'medium':'low';
  return{score,tier,reasons};
}
function prioritySentence(a,pr){
  if(a.completed)return 'Already completed — nice.';
  const parts=[];const d=daysUntil(a.dueDate);
  if(d<0)parts.push(`it is ${d===-1?'a day':-d+' days'} overdue`);
  else if(d===0)parts.push("it's due today");
  else if(d===1)parts.push("it's due tomorrow");
  else parts.push(`it's due in ${d} days`);
  if(a.difficulty!=='easy')parts.push(`it's ${a.difficulty}`);
  const remain=Math.max(5,Math.round(a.estimatedMinutes*(1-a.progress/100)));
  parts.push(`it should take about ${minutesLabel(remain)}${a.progress>0?' more':''}`);
  if(a.importance==='high')parts.push("and it's marked high importance");
  const t=nextTestFor(a.subjectId);
  if(t){const td=daysUntil(t.date);if(td<=10)parts.push(`plus ${t.name} is ${td===0?'today':'in '+td+' days'}`);}
  const lead={urgent:'Focus on this first:',high:'High priority:',medium:'Medium priority:',low:'Low priority:'}[pr.tier];
  return `${lead} ${parts.join(', ')}.`;
}
function upcomingTests(within=14){
  const list=state.tests.filter(t=>{const d=daysUntil(t.date);return d>=0&&d<=within;}).map(t=>({kind:'test',t,d:daysUntil(t.date)}));
  state.assignments.forEach(a=>{if(!a.completed&&(a.type==='test'||a.type==='quiz')){const d=daysUntil(a.dueDate);if(d>=0&&d<=within)list.push({kind:'asg',a,d});}});
  return list.sort((x,y)=>x.d-y.d);
}
function streak(){
  let n=0;const d=new Date();
  const has=ds=>state.sessions.some(s=>s.date===ds&&s.minutes>=10);
  if(!has(dateStr(d)))d.setDate(d.getDate()-1);
  while(has(dateStr(d))){n++;d.setDate(d.getDate()-1);}
  return n;
}
function weekStartStr(){
  const d=new Date();
  const shift=state.prefs.weekStart==='monday'?(d.getDay()+6)%7:d.getDay();
  return dateStr(addDays(d,-shift));
}
function weekLoad(){return stats().inc.filter(a=>{const d=daysUntil(a.dueDate);return d>=0&&d<=6;}).reduce((n,a)=>n+Math.max(5,Math.round(a.estimatedMinutes*(1-a.progress/100))),0);}
function focusItems(){
  const inc=state.assignments.filter(a=>!a.completed);
  if(!inc.length)return[];
  const scored=inc.map(a=>({a,score:priorityOf(a).score})).sort((x,y)=>y.score-x.score);
  let pick=scored.filter(x=>x.score>=35||daysUntil(x.a.dueDate)<=1).slice(0,8);
  if(!pick.length)pick=scored.slice(0,3);
  return pick.map(x=>x.a);
}
function logSession(mins,asgId,label=''){
  state.sessions.push({id:uid(),date:today(),minutes:mins,assignmentId:asgId||null,label,t:Date.now()});
  if(asgId){
    const a=findA(asgId);
    if(a){
      a.workedMinutes=(a.workedMinutes||0)+mins;
      const np=clamp(Math.round(a.progress+mins/Math.max(1,a.estimatedMinutes)*100),0,100);
      if(np>a.progress)a.progress=np;
      if(np>=100&&!a.completed){a.completed=true;a.completedAt=Date.now();setTimeout(()=>toast(`“${a.title}” is now complete.`,{tone:'success'}),900);}
    }
  }
  save();
}

/* ================= toast & modal ================= */
function toast(msg,{title='',tone='info',t=4200}={}){
  const box=$('#toasts');if(!box)return;
  const ic={success:'check',warn:'alert',danger:'alert',info:'spark'}[tone]||'spark';
  const el=document.createElement('div');
  el.className='toast t-'+tone;
  el.innerHTML=`<span class="ti">${icon(ic,16)}</span><div class="grow">${title?`<div class="toast-t">${esc(title)}</div>`:''}<div>${msg}</div></div><button class="toast-x" aria-label="Dismiss notification">${icon('x',14)}</button>`;
  el.querySelector('.toast-x').onclick=()=>el.remove();
  box.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300);},t);
}
let modalTrap=null,modalPrev=null;
function openModal(html,{label='Dialog',onMount}={}){
  const root=$('#modal-root');
  if(root.children.length)closeModal();
  root.innerHTML=`<div class="modal-scrim"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(label)}" tabindex="-1">${html}</div></div>`;
  document.body.classList.add('modal-open');
  const scrim=root.firstElementChild,modal=root.querySelector('.modal');
  scrim.addEventListener('click',e=>{if(e.target===scrim)closeModal();});
  modalPrev=document.activeElement;
  modalTrap=e=>{
    if(e.key==='Escape'){e.stopPropagation();closeModal();}
    else if(e.key==='Tab'){
      const f=$$('button,input,select,textarea,a[href]',modal).filter(x=>!x.disabled&&x.offsetParent!==null);
      if(!f.length)return;
      const first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
  };
  document.addEventListener('keydown',modalTrap);
  if(onMount)onMount(modal);
  const autoFocus=$('[autofocus]',modal)||$('input,select,textarea,button',modal);
  (autoFocus||modal).focus();
}
function closeModal(){
  const root=$('#modal-root');
  if(modalTrap){document.removeEventListener('keydown',modalTrap);modalTrap=null;}
  root.innerHTML='';
  document.body.classList.remove('modal-open');
  if(modalPrev&&modalPrev.focus)modalPrev.focus();
}
function confirmDialog({title,message,confirmText='Confirm',danger=true}){
  return new Promise(res=>{
    openModal(`<div class="confirm">
      <div class="m-head"><h3>${esc(title)}</h3></div>
      <p class="muted">${esc(message)}</p>
      <div class="f-actions"><button class="btn btn-ghost" data-x="no">Cancel</button><button class="btn ${danger?'btn-danger':'btn-primary'}" data-x="ok" autofocus>${esc(confirmText)}</button></div>
    </div>`,{label:title,onMount(m){
      m.querySelector('[data-x="no"]').onclick=()=>{closeModal();res(false);};
      m.querySelector('[data-x="ok"]').onclick=()=>{closeModal();res(true);};
    }});
  });
}

function dueChip(a){
  const d=daysUntil(a.dueDate);let cls,txt;
  if(a.completed){cls='due-done';txt='Completed';}
  else if(d<0){cls='due-overdue';txt=`Overdue · ${-d}d`;}
  else if(d===0){cls='due-today';txt='Due today'+(a.dueTime?` · ${fmtHM(a.dueTime)}`:'');}
  else if(d===1){cls='due-soon';txt='Tomorrow';}
  else{cls='due-later';txt=d<=6?new Date(a.dueDate+'T00:00:00').toLocaleDateString('en-US',{weekday:'short'}):fmtDate(a.dueDate);}
  return `<span class="chip ${cls}">${icon('clock',12)} ${txt}</span>`;
}
function priorityChip(a){const pr=priorityOf(a);return `<span class="chip chip-${pr.tier}">${pr.tier==='done'?'Done':cap(pr.tier)}</span>`;}
function statusChip(a){const m={todo:['st-todo','Not started'],progress:['st-progress','In progress'],completed:['st-completed','Completed'],overdue:['st-overdue','Overdue']};const[c,l]=m[statusOf(a)];return `<span class="chip ${c}">${l}</span>`;}

/* ================= quick-add parser ================= */
function parseQuickAdd(text){
  const out={};let rest=' '+text+' ';
  const cut=re=>{const m=rest.match(re);if(m){rest=rest.replace(m[0],' ');return m;}return null;};
  let tm=cut(/\b(\d+(?:\.\d+)?)\s*(hours?|hrs?|h)\b/i);
  if(tm)out.minutes=Math.round(parseFloat(tm[1])*60);
  else{tm=cut(/\b(\d+)\s*(minutes?|mins?|m)\b/i);if(tm)out.minutes=parseInt(tm[1],10);}
  if(cut(/\bhard|difficult\b/i))out.difficulty='hard';
  else if(cut(/\beasy\b/i))out.difficulty='easy';
  else if(cut(/\bmedium|moderate\b/i))out.difficulty='medium';
  if(cut(/\b(very\s+)?important\b/i))out.importance='high';
  const types={test:'test',exam:'test',quiz:'quiz',essay:'essay',project:'project',worksheet:'homework',homework:'homework',reading:'homework'};
  for(const k in types){if(cut(new RegExp('\\b'+k+'\\b','i'))){out.type=types[k];break;}}
  const d0=new Date();
  if(cut(/\btoday\b/i))out.dueDate=today();
  else if(cut(/\btonight\b/i)){out.dueDate=today();out.dueTime='21:00';}
  else if(cut(/\btomorrow\b/i))out.dueDate=dateStr(addDays(d0,1));
  else if(cut(/\bnext week\b/i))out.dueDate=dateStr(addDays(d0,7));
  else{
    const inN=cut(/\bin\s+(\d+)\s*(day|days|week|weeks)\b/i);
    if(inN)out.dueDate=dateStr(addDays(d0,parseInt(inN[1],10)*(inN[2].startsWith('week')?7:1)));
    else{
      const wd=cut(/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i);
      if(wd){
        const names=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
        let diff=(names.indexOf(wd[1].toLowerCase())-d0.getDay()+7)%7;if(diff===0)diff=7;
        out.dueDate=dateStr(addDays(d0,diff));
      }else{
        const md=cut(/\b(\d{1,2})\/(\d{1,2})\b/);
        if(md){const dt=new Date(d0.getFullYear(),+md[1]-1,+md[2]);if(dt<d0)dt.setFullYear(dt.getFullYear()+1);out.dueDate=dateStr(dt);}
      }
    }
  }
  cut(/\bdue\b/i);cut(/\bon\b/i);
  let matched=null;
  for(const s of state.subjects){
    if(text.toLowerCase().includes(s.name.toLowerCase())){matched=s;rest=rest.replace(new RegExp(escapeRe(s.name),'i'),' ');break;}
  }
  if(!matched){
    const words=text.toLowerCase().split(/[^a-z0-9]+/);
    for(const s of state.subjects){
      const sn=s.name.toLowerCase();
      if(words.some(w=>w.length>=3&&sn.startsWith(w))){matched=s;break;}
    }
  }
  if(matched)out.subjectId=matched.id;
  out.title=rest.replace(/\s+/g,' ').trim();
  if(!out.title)out.title=matched?`${matched.name} ${out.type||'assignment'}`:text.trim();
  return out;
}

function toggleComplete(id){

let AF={q:'',subject:'all',status:'all',priority:'all',sort:'due'};
function asgFiltered(){
  let list=[...state.assignments];

  if(AF.subject!=='all')list=list.filter(a=>a.subjectId===AF.subject);
  if(AF.status!=='all')list=list.filter(a=>statusOf(a)===AF.status);
  if(AF.priority!=='all')list=list.filter(a=>priorityOf(a).tier===AF.priority);
  const byDone=(a,b)=>Number(a.completed)-Number(b.completed);
  if(AF.sort==='due')list.sort((a,b)=>byDone(a,b)||a.dueDate.localeCompare(b.dueDate)||(a.dueTime||'').localeCompare(b.dueTime||''));
  if(AF.sort==='priority')list.sort((a,b)=>byDone(a,b)||priorityOf(b).score-priorityOf(a).score);
  if(AF.sort==='time')list.sort((a,b)=>byDone(a,b)||b.estimatedMinutes-a.estimatedMinutes);
  return list;
}

function generatePlan(){
  const p=state.prefs;
  const blocks=[];
  const schoolDur=toMin(p.schoolEnd)-toMin(p.schoolStart);
  if(schoolDur>0)blocks.push({id:uid(),type:'school',label:'School',start:p.schoolStart,minutes:schoolDur,done:false});
  let t=toMin(p.dayStart);
  const END=21*60+30;
  const tasks=state.assignments.filter(a=>!a.completed).map(a=>({a,pr:priorityOf(a)})).sort((x,y)=>y.pr.score-x.pr.score);
  let dinner=false;
  for(const{a}of tasks){
    if(t>=END-15)break;
    if(!dinner&&t>=18*60){blocks.push({id:uid(),type:'break',label:'Dinner',start:hm(t),minutes:30,done:false});t+=30;dinner=true;}
    const remain=Math.max(15,Math.round(a.estimatedMinutes*(1-a.progress/100)));
    const dur=Math.min(remain,90);
    if(t+dur>END)break;
    blocks.push({id:uid(),type:'task',label:a.title,assignmentId:a.id,start:hm(t),minutes:dur,done:false});
    t+=dur;
    if(t<END-10){const br=dur>=50?15:10;blocks.push({id:uid(),type:'break',label:'Break',start:hm(t),minutes:br,done:false});t+=br;}
  }
  return{date:today(),blocks};
}

/* ================= timer ================= */
const RING_C=779;
const Timer={iv:null,total:25*60,remaining:25*60,running:false,linkedId:null,label:'',mode:'25',_done:false,
  configure(min,linkId=null,mode=null){this.stop();this.total=this.remaining=clamp(Math.round(min),1,180)*60;this.linkedId=linkId;this.label='';this.mode=mode||String(min);this._done=false;this.paint();tickPill();},
  start(){if(this.running)return;if(this._done){this._done=false;this.remaining=this.total;}this.endAt=Date.now()+this.remaining*1000;this.running=true;this.iv=setInterval(()=>this.tick(),250);this.paint();tickPill();},
  pause(){if(!this.running)return;this.remaining=Math.max(0,Math.round((this.endAt-Date.now())/1000));this.stop();this.paint();tickPill();},
  stop(){clearInterval(this.iv);this.iv=null;this.running=false;},
  reset(){this.stop();this.remaining=this.total;this._done=false;this.paint();tickPill();},
  tick(){const r=Math.max(0,Math.round((this.endAt-Date.now())/1000));if(r!==this.remaining){this.remaining=r;this.paint();tickPill();}if(r<=0)this.finish();},
  finish(){
    if(this._done)return;this._done=true;this.stop();
    const mins=Math.round(this.total/60);
    logSession(mins,this.linkedId,this.label);
    this.remaining=this.total;this.paint();ping();tickPill();renderPage();updateBell();
    toast(`Great work! You completed a ${mins}-minute study session.`,{tone:'success',title:'Session complete',t:6500});
  },
  paint(){
    const t=$('#t-time');if(t)t.textContent=fmtTimer(this.remaining);
    const r=$('#t-ring');if(r)r.style.strokeDashoffset=RING_C*(this.remaining/this.total);
    const s=$('#t-state');if(s)s.textContent=this.running?'Focusing…':(this._done?'Session complete':'Ready to focus');
    const b=$('#t-toggle');if(b)b.innerHTML=`${icon(this.running?'pause':'play',16)} ${this.running?'Pause':'Start'}`;
  }
};
function tickPill(){
  const el=$('#focus-pill');if(!el)return;
  if(Timer.running){el.hidden=false;el.querySelector('span').textContent=fmtTimer(Timer.remaining)+' · focus';}
  else el.hidden=true;
}
function ping(){
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const ctx=new C();
    [0,0.18,0.36].forEach((t,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=660+i*110;
      const T=ctx.currentTime+t;
      g.gain.setValueAtTime(0.0001,T);g.gain.exponentialRampToValueAtTime(0.16,T+0.03);g.gain.exponentialRampToValueAtTime(0.0001,T+0.5);
      o.start(T);o.stop(T+0.55);
    });
    setTimeout(()=>ctx.close(),1200);
  }catch(e){}
}
function startFocus(id){
  const a=findA(id);if(!a)return;
  const remain=Math.max(10,Math.round(a.estimatedMinutes*(1-a.progress/100)));
  const m=+state.prefs.sessionLength||25;
  Timer.configure(Math.min(m,remain),id,(m===25||m===50)?String(m):'custom');
  navigate('timer');
  setTimeout(()=>Timer.start(),400);
}

function last7Bars(){
  const days=[...Array(7)].map((_,i)=>{const d=addDays(new Date(),-(6-i));return{ds:dateStr(d),l:d.toLocaleDateString('en-US',{weekday:'short'}),m:sumSessions(dateStr(d))};});
  const max=Math.max(...days.map(x=>x.m),1);
  const total=days.reduce((n,x)=>n+x.m,0);
  return{total,html:days.map(x=>`<div class="bar-col" title="${x.l}: ${x.m} min"><span class="bar-v">${x.m||''}</span><div class="bar" style="height:${Math.max(4,Math.round(x.m/max*100))}%"></div><span class="bar-l">${x.l}</span></div>`).join('')};
}
function areaChart(){
  const pts=[...Array(14)].map((_,i)=>{const d=addDays(new Date(),-(13-i));return{ds:dateStr(d),v:sumSessions(dateStr(d))};});
  const W=560,H=150,P=8,B=H-12;
  const max=Math.max(...pts.map(p=>p.v),30);
  const X=i=>P+i*(W-2*P)/13;
  const Y=v=>B-4-(v/max)*(B-28);
  const xy=pts.map((p,i)=>[X(i),Y(p.v)]);
  let d=`M ${xy[0][0].toFixed(1)} ${xy[0][1].toFixed(1)}`;
  for(let i=1;i<xy.length;i++){
    const[x0,y0]=xy[i-1],[x1,y1]=xy[i];const mx=(x0+x1)/2;
    d+=` C ${mx.toFixed(1)} ${y0.toFixed(1)}, ${mx.toFixed(1)} ${y1.toFixed(1)}, ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  }
  const area=d+` L ${X(13).toFixed(1)} ${B} L ${X(0).toFixed(1)} ${B} Z`;
  return `<svg class="area" viewBox="0 0 ${W} ${H}" role="img" aria-label="Study minutes over the last 14 days">
    <path d="${area}" fill="url(#ag)"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
  </svg>
  <div class="flex between muted xs mt4"><span>${fmtDate(pts[0].ds)}</span><span>peak ${Math.max(...pts.map(p=>p.v))}m</span><span>${fmtDate(pts[13].ds)}</span></div>`;
}
function subjectLoads(){

    const inc=state.assignments.filter(a=>a.subjectId===s.id&&!a.completed);
    return{s,m:inc.reduce((n,a)=>n+Math.max(5,Math.round(a.estimatedMinutes*(1-a.progress/100))),0)};
  }).filter(r=>r.m>0);

}

/* ================= AI assistant ================= */
function md(t){
  return esc(t).split('\n').map(line=>{
    line=line.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    if(/^- /.test(line))return `<div class="li">${line.slice(2)}</div>`;
    if(!line.trim())return '<div class="sp"></div>';
    return `<div>${line}</div>`;
  }).join('');
}
function localAI(q){
  const t=q.toLowerCase();
  const inc=state.assignments.filter(a=>!a.completed);
  const scored=inc.map(a=>({a,pr:priorityOf(a)})).sort((x,y)=>y.pr.score-x.pr.score);
  const has=(...ws)=>ws.some(w=>t.includes(w));
  if(has('hello','hi ','hey','good morning','good evening')&&t.length<25){
    return `Hey ${state.prefs.name||'there'}! Here is your snapshot:\n- **${inc.length}** open assignments (${minutesLabel(inc.reduce((n,a)=>n+a.estimatedMinutes,0))} of estimated work)\n- ${inc.filter(a=>daysUntil(a.dueDate)<0).length} overdue\n- ${upcomingTests(14).length} upcoming tests\n\nAsk me "what should I work on?" whenever you need direction.`;
  }
  if(has('what should','work on','work next','priority','start with','most important','focus on')){
    if(!scored.length)return "You're all caught up — nothing open right now. Enjoy the breather, or get ahead on tomorrow's reading.";
    const{a,pr}=scored[0];const s=subj(a.subjectId);
    const remain=Math.max(5,Math.round(a.estimatedMinutes*(1-a.progress/100)));
    let r=`**Start with: ${a.title}** (${s.name})\n${relDue(a.dueDate)} · about ${minutesLabel(remain)} left · ${a.difficulty}\n\n${prioritySentence(a,pr)}`;
    if(scored[1]){
      r+=`\n\nAfter that:`;
      scored.slice(1,4).forEach(x=>{r+=`\n- ${x.a.title} — ${relDue(x.a.dueDate).toLowerCase()}, ~${minutesLabel(Math.round(x.a.estimatedMinutes*(1-x.a.progress/100)))}`;});
    }
    return r;
  }
  if(has('overdue','late','behind')){
    const od=inc.filter(a=>daysUntil(a.dueDate)<0);
    if(!od.length)return 'Good news — you have **nothing overdue**. You are keeping pace nicely.';
    return `You have **${od.length} overdue** ${od.length===1?'assignment':'assignments'}:\n${od.map(a=>`- ${a.title} — ${relDue(a.dueDate).toLowerCase()} (${subj(a.subjectId).name})`).join('\n')}\n\nI would clear these first — overdue work snowballs fast.`;
  }
  if(has('how much','this week','week','upcoming','homework do i have')){
    const wk=inc.filter(a=>{const d=daysUntil(a.dueDate);return d>=0&&d<=7;});
    if(!wk.length)return 'Your week is clear — no assignments due in the next 7 days.';
    let r=`You have **${wk.length} assignment${wk.length>1?'s':''}** due in the next 7 days — about **${minutesLabel(wk.reduce((n,a)=>n+a.estimatedMinutes,0))}** of work.`;
    const byDay={};wk.forEach(a=>{(byDay[a.dueDate]=byDay[a.dueDate]||[]).push(a);});
    Object.keys(byDay).sort().forEach(ds=>{r+=`\n- ${fmtDate(ds)}: ${byDay[ds].map(a=>a.title).join(', ')}`;});
    return r;
  }
  if(has('test','exam','study for')){
    const ts=state.tests.filter(x=>daysUntil(x.date)>=0).sort((a,b)=>a.date.localeCompare(b.date));
    if(!ts.length)return 'No tests on your calendar. Add one from the Tests page and I will help you plan for it.';
    let r='';
    ts.forEach(x=>{
      const d=daysUntil(x.date),need=Math.max(0,x.studyMinutesNeeded-x.studyMinutesDone);
      const per=d===0?need:clamp(Math.ceil(need/d),15,75);
      r+=`**${x.name}** (${subj(x.subjectId).name}) — ${d===0?'today':d===1?'tomorrow':'in '+d+' days'}\n`;
      r+=need>0?`About ${minutesLabel(need)} of studying left → aim for **${per} min${d>1?' today':''}**.`:'You have covered the planned study time — do a light review.';
      r+='\n\n';
    });
    return r.trim();
  }
  if(has('plan','schedule','my day','today')){
    const tasks=scored.slice(0,4);
    if(!tasks.length)return 'Nothing to plan — you are all caught up today.';
    let r='Here is how I would shape today:';
    tasks.forEach((x,i)=>{r+=`\n${i+1}. **${x.a.title}** — ${relDue(x.a.dueDate).toLowerCase()}, ~${minutesLabel(Math.round(x.a.estimatedMinutes*(1-x.a.progress/100)))}`;});
    r+='\n\nTake a 10–15 minute break between blocks. The **My Day** page builds this into a full timed schedule you can edit.';
    return r;
  }
  if(has('streak','how am i','progress','doing','stats')){
    const done=state.assignments.filter(a=>a.completed).length;
    const rate=state.assignments.length?Math.round(done/state.assignments.length*100):0;
    return `Here is where you stand:\n- **${rate}%** completion rate (${done}/${state.assignments.length} assignments)\n- **${streak()}-day** study streak\n- **${minutesLabel(totalStudy())}** studied in total\n- ${inc.filter(a=>daysUntil(a.dueDate)<0).length} overdue\n\n${rate>=75?'Great pace — keep it up!':rate>=40?'Solid progress. Finishing your oldest open tasks would lift this fast.':"Let's pick one assignment and finish it today — momentum first."}`;
  }
  if(has('add','create','new assignment')){
    return 'Easy — use the **Quick Add** bar on your Dashboard (or the New assignment button). Try typing:\n"Math worksheet due tomorrow 45 min hard"\n\nIt will parse the subject, date, time and difficulty for you, then open a confirmation form.';
  }
  if(has('help','what can','who are')){
    return `I'm your StudyFlow assistant — I look at your actual assignments, tests and study data to answer things like:\n- What should I work on?\n- What's overdue?\n- How much homework do I have this week?\n- When should I study for my test?\n- How am I doing?\n\nTip: add an OpenAI-compatible API key in Settings to upgrade me to a cloud model.`;
  }
  if(has('thank','thanks','ty'))return 'Anytime! Ping me when you need your next move.';
  return `I did not quite catch that, but here is what I can help with:\n- "What should I work on?"\n- "What's overdue?"\n- "How much homework do I have this week?"\n- "When should I study for my test?"\n- "Help me plan today"`;
}
function aiContext(){
  const inc=state.assignments.filter(a=>!a.completed).map(a=>({title:a.title,subject:subj(a.subjectId).name,due:a.dueDate,minutes:a.estimatedMinutes,difficulty:a.difficulty,progress:a.progress}));
  return `You are StudyFlow's study assistant. Today is ${today()}. Student: ${state.prefs.name}. Open assignments (JSON): ${JSON.stringify(inc)}. Tests: ${JSON.stringify(state.tests.map(t=>({name:t.name,date:t.date})))}. Study streak: ${streak()} days. Be concise, warm, and specific to this data.`;
}
async function remoteAI(q){
  const base=(state.prefs.aiUrl||'https://api.openai.com/v1').replace(/\/+$/,'');
  const res=await fetch(base+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.prefs.aiKey},body:JSON.stringify({model:state.prefs.aiModel||'gpt-4o-mini',messages:[{role:'system',content:aiContext()},{role:'user',content:q}]})});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const d=await res.json();
  const txt=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
  if(!txt)throw new Error('empty response');
  return txt;
}
function appendMsg(m){
  const box=$('#chat-msgs');if(!box)return;
  const div=document.createElement('div');
  div.className='msg '+(m.role==='user'?'user':'ai');
  div.innerHTML=`<div class="msg-body">${md(m.text)}</div>`;
  box.appendChild(div);box.scrollTop=box.scrollHeight;
}
function sendChat(text){
  text=(text||'').trim();if(!text)return;
  state.chat.push({role:'user',text,t:Date.now()});save();appendMsg(state.chat[state.chat.length-1]);
  const inp=$('#chat-input');if(inp)inp.value='';
  const box=$('#chat-msgs');let typer=null;
  if(box){
    typer=document.createElement('div');typer.className='msg ai';
    typer.innerHTML='<div class="msg-body typing"><span></span><span></span><span></span></div>';
    box.appendChild(typer);box.scrollTop=box.scrollHeight;
  }
  setTimeout(async()=>{
    let reply='',note='';
    if(state.prefs.aiKey){try{reply=await remoteAI(text);}catch(e){note=`Cloud AI unavailable (${e.message}) — answering on-device.`;}}
    if(!reply)reply=localAI(text);
    if(note)reply=note+'\n\n'+reply;
    if(typer)typer.remove();
    state.chat.push({role:'ai',text:reply,t:Date.now()});save();appendMsg(state.chat[state.chat.length-1]);
  },600+Math.random()*500);
}

/* ================= notifications ================= */
function buildNotifs(){
  const out=[];const inc=state.assignments.filter(a=>!a.completed);
  inc.filter(a=>daysUntil(a.dueDate)<0).slice(0,3).forEach(a=>out.push({key:'ovd-'+a.id,tone:'danger',icon:'alert',text:`${a.title} is overdue — was due ${fmtDate(a.dueDate)}.`}));
  inc.filter(a=>daysUntil(a.dueDate)===0).slice(0,3).forEach(a=>out.push({key:'today-'+a.id,tone:'warn',icon:'clock',text:`${a.title} is due today.`}));
  inc.filter(a=>daysUntil(a.dueDate)===1).slice(0,2).forEach(a=>out.push({key:'tmrw-'+a.id,tone:'warn',icon:'calendar',text:`${a.title} is due tomorrow.`}));
  const wk=inc.filter(a=>{const d=daysUntil(a.dueDate);return d>=0&&d<=6;});
  if(wk.length>=2)out.push({key:'week-'+weekStartStr(),tone:'info',icon:'calendar',text:`You have ${wk.length} assignments due this week.`});
  state.tests.forEach(t=>{const d=daysUntil(t.date);if(d>=1&&d<=7)out.push({key:'test-'+t.id,tone:'info',icon:'grad',text:`Your ${t.name} is in ${d} day${d>1?'s':''}.`});});
  const st=streak();if(st>=3)out.push({key:'streak-'+st,tone:'success',icon:'flame',text:`You're on a ${st}-day study streak!`});
  const rank={danger:0,warn:1,info:2,success:3};
  return out.sort((a,b)=>rank[a.tone]-rank[b.tone]);
}
function updateBell(){
  const b=$('#bell-badge');if(!b)return;

}
